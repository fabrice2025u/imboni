<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Display</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
}

/* HEADER */

.topbar{
    width:100%;
    background:#111827;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.logo{
    color:white;
    font-size:26px;
    font-weight:700;
}

.back{
    text-decoration:none;
    color:white;
    background:#dc2626;
    padding:10px 18px;
    border-radius:10px;
    font-weight:600;
    transition:0.3s;
}

.back:hover{
    background:#b91c1c;
}

/* MAIN */

.wrapper{
    padding:40px 20px;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* IMAGE */

.news-image{
    width:100%;
    height:500px;
    object-fit:cover;
}

/* CONTENT */

.content{
    padding:35px;
}

/* CATEGORY */

.category{
    display:inline-block;
    background:#fee2e2;
    color:#dc2626;
    padding:8px 16px;
    border-radius:50px;
    font-size:14px;
    font-weight:600;
    margin-bottom:20px;
}

/* TITLE */

.title{
    font-size:42px;
    line-height:1.3;
    margin-bottom:20px;
    color:#111827;
}

/* HEADER TEXT */

.header-text{
    font-size:22px;
    color:#4b5563;
    margin-bottom:25px;
    line-height:1.7;
    font-weight:400;
}

/* AUTHOR */

.author-box{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
    padding-bottom:25px;
    border-bottom:1px solid #e5e7eb;
}

.profile{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#dc2626;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:700;
}

.author-info h4{
    font-size:17px;
}

.date{
    color:#6b7280;
    font-size:14px;
    margin-top:4px;
}

/* BODY */

.body{
    font-size:19px;
    line-height:2;
    color:#374151;
}

/* COMMENT */

.comment-container{
    padding:35px;
    border-top:1px solid #e5e7eb;
}

.comment-container h2{
    margin-bottom:25px;
    color:#dc2626;
    font-size:28px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#111827;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

.input-group textarea{
    min-height:150px;
    resize:vertical;
}

.input-group input:focus,
.input-group textarea:focus{
    border-color:#dc2626;
}

.comment-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.comment-btn:hover{
    background:#b91c1c;
}

/* LOADING */

.loading{
    text-align:center;
    padding:60px;
    font-size:22px;
    color:gray;
}

/* ERROR */

.error{
    text-align:center;
    padding:60px;
    color:red;
    font-size:22px;
    font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:768px){

    .title{
        font-size:28px;
    }

    .header-text{
        font-size:18px;
    }

    .body{
        font-size:17px;
    }

    .news-image{
        height:300px;
    }

    .content{
        padding:20px;
    }

    .comment-container{
        padding:20px;
    }

    .topbar{
        flex-direction:column;
        gap:15px;
    }

}

</style>
</head>

<body>

<div class="topbar">

    <div class="logo">News Writer Pro</div>

    <a class="back" href="index.html">← Back Home</a>

</div>

<div class="wrapper">

    <div class="container" id="content">

        <div class="loading">
            Loading article...
        </div>

    </div>

</div>

<script>

/* GET ID FROM URL */

const urlParams = new URLSearchParams(window.location.search);

const id = urlParams.get('id');

/* FETCH NEWS */

fetch(`http://localhost:3000/news/${id}`)

.then(res => {

    if(!res.ok){

        throw new Error("News not found");

    }

    return res.json();

})

.then(news => {

    document.getElementById("content").innerHTML = `

        ${
            news.image
            ? `<img src="${news.image}" class="news-image">`
            : ``
        }

        <div class="content">

            <div class="category">
                ${news.category || "General"}
            </div>

            <h1 class="title">
                ${news.title}
            </h1>

            <div class="header-text">
                ${news.header || ""}
            </div>

            <div class="author-box">

                <div class="profile">
                    N
                </div>

                <div class="author-info">

                    <h4>News Writer Pro</h4>

                    <div class="date">
                        Published:
                        ${new Date(news.created_at).toLocaleString()}
                    </div>

                </div>

            </div>

            <div class="body">
                ${news.body}
            </div>

        </div>

        <div class="comment-container">

            <h2>Leave A Comment</h2>

            <form>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" name="fullname" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Comment</label>
                    <textarea name="comment" placeholder="Write your comment..." required></textarea>
                </div>

                <button type="submit" class="comment-btn">
                    Post Comment
                </button>

            </form>

        </div>

    `;

})

.catch(err => {

    document.getElementById("content").innerHTML = `

        <div class="error">

            News not found or server error

        </div>

    `;

});

</script>

</body>
</html>
