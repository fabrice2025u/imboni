<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f5f9;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:400px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

.login-container h1{
    text-align:center;
    margin-bottom:25px;
    color:#e63946;
    font-size:32px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
    font-size:16px;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#e63946;
    box-shadow:0 0 5px rgba(230,57,70,0.3);
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    background:#e63946;
    color:white;
    font-size:17px;
    font-weight:bold;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#c1121f;
}

.register-link{
    text-align:center;
    margin-top:20px;
    color:#555;
}

.register-link a{
    color:#e63946;
    text-decoration:none;
    font-weight:bold;
}

.register-link a:hover{
    text-decoration:underline;
}

@media(max-width:500px){

    .login-container{
        padding:25px;
    }

    .login-container h1{
        font-size:26px;
    }

}

</style>
</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <form>

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="register-link">
        Don't have account?
        <a href="">Register</a>
    </div>

</div>

</body>
</html>
