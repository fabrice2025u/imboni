<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - News</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.add{
    display:inline-block;
    margin-bottom:20px;
    background:#10b981;
    color:white;
    padding:10px 15px;
    text-decoration:none;
    border-radius:6px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#111827;
    color:white;
}

img{
    width:80px;
    height:60px;
    object-fit:cover;
    border-radius:5px;
}

.btn{
    padding:7px 12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.edit{
    background:#3b82f6;
}

.delete{
    background:#ef4444;
}

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    width:500px;
    background:white;
    padding:20px;
    border-radius:10px;
}

.modal-content input,
.modal-content textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.modal-content textarea{
    height:150px;
    resize:none;
}

.save{
    background:#10b981;
    margin-top:15px;
}

.close{
    background:#ef4444;
    margin-top:15px;
}

.preview{
    width:100%;
    height:200px;
    object-fit:cover;
    margin-top:10px;
    border-radius:8px;
}

@media(max-width:768px){

    table{
        display:block;
        overflow-x:auto;
    }

    .modal-content{
        width:95%;
    }

}

</style>
</head>

<body>

<h1>Admin News Panel</h1>



<table>

<thead>
<tr>
<th>ID</th>
<th>Image</th>
<th>Title</th>
<th>Body</th>
<th>Date</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="newsTable"></tbody>

</table>

<!-- EDIT MODAL -->

<div class="modal" id="editModal">

<div class="modal-content">

<h2>Edit News</h2>

<input type="text" id="editTitle" placeholder="Title">

<textarea id="editBody"></textarea>

<input type="file" id="editImage">

<img id="previewImage" class="preview">

<button class="btn save" onclick="updateNews()">Save Changes</button>

<button class="btn close" onclick="closeModal()">Close</button>

</div>

</div>

<script>

const API = "http://localhost:3000/news";

let currentId = null;
let currentImage = "";

// ======================
// LOAD NEWS
// ======================

async function loadNews(){

    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("newsTable");

    table.innerHTML = "";

    data.forEach(news => {

        table.innerHTML += `
        
        <tr>

        <td>${news.id}</td>

        <td>
            <img src="http://localhost:3000${news.image}">
        </td>

        <td>${news.title}</td>

        <td>${news.body.substring(0,80)}...</td>

        <td>${news.created_at}</td>

        <td>

            <button class="btn edit" onclick="openEdit(${news.id})">
            Edit
            </button>

            <button class="btn delete" onclick="deleteNews(${news.id})">
            Delete
            </button>

        </td>

        </tr>

        `;

    });

}

// ======================
// DELETE NEWS
// ======================

async function deleteNews(id){

    const confirmDelete = confirm("Delete this news?");

    if(confirmDelete){

        await fetch(`http://localhost:3000/news/${id}`,{
            method:"DELETE"
        });

        loadNews();

    }

}

// ======================
// OPEN EDIT
// ======================

async function openEdit(id){

    currentId = id;

    const res = await fetch(`http://localhost:3000/news/${id}`);

    const news = await res.json();

    document.getElementById("editTitle").value = news.title;

    document.getElementById("editBody").value = news.body;

    document.getElementById("previewImage").src =
    `http://localhost:3000${news.image}`;

    currentImage = news.image;

    document.getElementById("editModal").style.display = "flex";

}

// ======================
// CLOSE MODAL
// ======================

function closeModal(){

    document.getElementById("editModal").style.display = "none";

}

// ======================
// UPDATE NEWS
// ======================

async function updateNews(){

    let imagePath = currentImage;

    const imageFile = document.getElementById("editImage").files[0];

    // upload new image if selected

    if(imageFile){

        const formData = new FormData();

        formData.append("image", imageFile);

        const uploadRes = await fetch("http://localhost:3000/upload",{
            method:"POST",
            body:formData
        });

        const uploadData = await uploadRes.json();

        imagePath = uploadData.path;

    }

    // update news

    await fetch(`http://localhost:3000/news/${currentId}`,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            title:document.getElementById("editTitle").value,

            body:document.getElementById("editBody").value,

            image:imagePath

        })

    });

    closeModal();

    loadNews();

}

// ======================
// IMAGE PREVIEW
// ======================

document.getElementById("editImage").addEventListener("change",(e)=>{

    const file = e.target.files[0];

    if(file){

        document.getElementById("previewImage").src =
        URL.createObjectURL(file);

    }

});

// ======================

loadNews();

</script>

</body>
</html>
